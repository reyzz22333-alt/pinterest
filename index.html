```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinterest Clone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

/* Navbar */
nav{
    position:sticky;
    top:0;
    z-index:100;
    background:white;
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.logo{
    color:#e60023;
    font-size:28px;
    font-weight:bold;
}

.search-box{
    flex:1;
}

.search-box input{
    width:100%;
    padding:12px 18px;
    border:none;
    border-radius:30px;
    background:#efefef;
    outline:none;
    font-size:16px;
}

.upload-btn{
    background:#e60023;
    color:white;
    padding:10px 18px;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.upload-btn:hover{
    background:#c4001d;
}

.profile{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

/* Masonry Layout */
.gallery{
    column-count:4;
    column-gap:15px;
    padding:20px;
}

.card{
    break-inside:avoid;
    margin-bottom:15px;
    position:relative;
    overflow:hidden;
    border-radius:18px;
    background:white;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    display:block;
}

.card .title{
    padding:12px;
    font-weight:bold;
}

/* Modal */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    max-width:80%;
    max-height:80%;
    border-radius:15px;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

@media(max-width:992px){
    .gallery{
        column-count:3;
    }
}

@media(max-width:768px){
    .gallery{
        column-count:2;
    }
}

@media(max-width:500px){
    .gallery{
        column-count:1;
    }

    nav{
        flex-wrap:wrap;
    }

    .search-box{
        width:100%;
        order:3;
    }
}
</style>
</head>
<body>

<nav>
    <div class="logo">Pinterest</div>

    <div class="search-box">
        <input type="text" id="search" placeholder="Cari gambar...">
    </div>

    <label class="upload-btn">
        + Tambah Foto
        <input type="file" id="uploadImage" accept="image/*" hidden>
    </label>

    <div class="profile">R</div>
</nav>

<div class="gallery" id="gallery"></div>

<!-- Modal -->
<div class="modal" id="modal">
    <span class="close">&times;</span>
    <img id="modalImg" class="modal-content">
</div>

<script>
const images = [
{
title:"Nature",
url:"https://picsum.photos/400/600?random=1"
},
{
title:"Mountain",
url:"https://picsum.photos/400/500?random=2"
},
{
title:"Travel",
url:"https://picsum.photos/400/700?random=3"
},
{
title:"Food",
url:"https://picsum.photos/400/550?random=4"
},
{
title:"City",
url:"https://picsum.photos/400/650?random=5"
},
{
title:"Beach",
url:"https://picsum.photos/400/500?random=6"
},
{
title:"Art",
url:"https://picsum.photos/400/700?random=7"
},
{
title:"Design",
url:"https://picsum.photos/400/550?random=8"
}
];

const gallery = document.getElementById("gallery");

function renderGallery(data){
    gallery.innerHTML = "";

    data.forEach(item=>{
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${item.url}" alt="${item.title}">
            <div class="title">${item.title}</div>
        `;

        card.addEventListener("click",()=>{
            modal.style.display = "flex";
            modalImg.src = item.url;
        });

        gallery.appendChild(card);
    });
}

renderGallery(images);

/* Upload Foto */
document.getElementById("uploadImage")
.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        images.unshift({
            title:file.name,
            url:event.target.result
        });

        renderGallery(images);
    };

    reader.readAsDataURL(file);
});

/* Search */
document.getElementById("search")
.addEventListener("keyup", e=>{

    const keyword = e.target.value.toLowerCase();

    const filtered = images.filter(item =>
        item.title.toLowerCase().includes(keyword)
    );

    renderGallery(filtered);
});

/* Modal */
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

document.querySelector(".close").onclick = ()=>{
    modal.style.display = "none";
};

modal.onclick = (e)=>{
    if(e.target === modal){
        modal.style.display = "none";
    }
};
</script>

</body>
</html>
